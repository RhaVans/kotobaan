<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Katalog Kanji — JFT A2 / Irodori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+JP:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment: #EFE6D2;
    --parchment-deep: #E4D8BC;
    --card: #FBF6E9;
    --ink: #241C13;
    --ink-soft: #5B5040;
    --ink-faint: #8B8069;
    --violet: #6B4C9A;
    --violet-deep: #4C3572;
    --violet-pale: #E9E1F4;
    --rule: #CBB98D;
    --stamp: #A13F2E;
    --green: #4A6B4E;
    --shadow: 0 1px 0 rgba(36,28,19,0.06), 0 8px 24px -12px rgba(36,28,19,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #F5EEDC 0%, transparent 60%),
      var(--parchment);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 16px 40px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{ width:100%; max-width:440px; }

  /* ---- Header: catalog ledger strip ---- */
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--rule);
    padding-bottom:10px; margin-bottom:16px;
  }
  .title{
    font-family:'Source Serif 4',serif;
    font-weight:700; font-size:19px; letter-spacing:0.01em; color:var(--ink);
  }
  .title small{
    display:block; font-family:'Inter',sans-serif; font-weight:500;
    font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--ink-faint); margin-top:2px;
  }
  .count-badge{
    font-family:'Source Serif 4',serif; font-style:italic; font-size:13px;
    color:var(--violet-deep); white-space:nowrap;
  }

  /* ---- Section select ---- */
  .section-row{
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .section-label{
    font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-faint); flex-shrink:0;
  }
  .section-select{
    flex:1; appearance:none; -webkit-appearance:none;
    background:var(--card) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235B5040"/></svg>') no-repeat right 12px center;
    border:1px solid var(--rule); border-radius:8px;
    padding:9px 30px 9px 12px;
    font-family:'Source Serif 4',serif; font-weight:600; font-size:13.5px; color:var(--ink);
    cursor:pointer;
  }

  /* ---- Filter chips ---- */
  .filters{ display:flex; gap:6px; margin-bottom:14px; }
  .chip{
    flex:1; text-align:center; padding:7px 6px; border-radius:20px;
    border:1px solid var(--rule); background:transparent;
    font-family:'Inter',sans-serif; font-size:11.5px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; transition:all .15s ease;
  }
  .chip.active{ background:var(--violet); border-color:var(--violet); color:#fff; }

  /* ---- Progress ---- */
  .progress-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .progress-track{
    flex:1; height:3px; background:var(--rule); border-radius:2px; overflow:hidden;
  }
  .progress-fill{ height:100%; background:var(--violet); transition:width .25s ease; }
  .progress-label{
    font-size:11px; font-variant-numeric:tabular-nums; color:var(--ink-faint); white-space:nowrap;
  }

  /* ---- Card stage ---- */
  .stage{ perspective:1600px; margin-bottom:18px; }
  .card{
    position:relative; width:100%; height:340px;
    transform-style:preserve-3d; transition:transform .5s cubic-bezier(.22,.68,.29,1.15);
    cursor:pointer;
  }
  .card.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden;
    background:var(--card);
    border-radius:6px;
    box-shadow:var(--shadow);
    border:1px solid rgba(36,28,19,0.08);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  /* catalog notch tab */
  .face::before{
    content:''; position:absolute; top:0; left:22px; width:64px; height:9px;
    background:var(--parchment); border-radius:0 0 5px 5px;
  }
  .face-top{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 16px 0 16px;
  }
  .catalog-no{
    font-family:'Source Serif 4',serif; font-style:italic; font-size:12px; color:var(--ink-faint);
  }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:var(--rule); }
  .status-dot.known{ background:var(--green); }

  .face-body{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:10px 24px;
  }
  .kanji-glyph{
    font-family:'Noto Serif JP',serif; font-weight:500;
    font-size:clamp(56px, 17vw, 88px);
    line-height:1.15; color:var(--ink); text-align:center;
  }
  .kanji-glyph rt{
    font-family:'Inter',sans-serif; font-weight:600; font-size:0.28em;
    color:var(--violet-deep); letter-spacing:0.02em;
  }
  .kanji-glyph.hide-furigana rt{ visibility:hidden; }

  .face-bottom{
    text-align:center; padding:0 20px 18px;
    font-size:11px; color:var(--ink-faint); letter-spacing:0.06em;
  }

  .back{ transform:rotateY(180deg); background:var(--violet-pale); border-color:rgba(76,53,114,0.18); align-items:center; justify-content:center; text-align:center; padding:28px 24px; }
  .back .reading{
    font-family:'Noto Serif JP',serif; font-weight:700; font-size:30px; color:var(--violet-deep);
    margin-bottom:14px;
  }
  .back .rule{ width:36px; height:1px; background:var(--violet-deep); opacity:.35; margin-bottom:14px; }
  .back .meaning{
    font-family:'Source Serif 4',serif; font-weight:600; font-style:italic; font-size:22px; color:var(--ink);
    line-height:1.3;
  }
  .back .hint{
    margin-top:18px; font-family:'Inter',sans-serif; font-size:10.5px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--violet-deep); opacity:.6;
  }

  /* ---- Controls ---- */
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; padding:0 2px;
  }
  .toggle-label{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .switch{
    width:40px; height:23px; border-radius:20px; background:var(--rule);
    position:relative; cursor:pointer; transition:background .2s ease; flex-shrink:0;
  }
  .switch.on{ background:var(--violet); }
  .switch::after{
    content:''; position:absolute; top:2px; left:2px; width:19px; height:19px;
    border-radius:50%; background:#fff; transition:transform .2s ease;
    box-shadow:0 1px 2px rgba(0,0,0,0.25);
  }
  .switch.on::after{ transform:translateX(17px); }

  .nav-row{ display:flex; gap:8px; margin-bottom:10px; }
  .btn{
    flex:1; padding:13px 10px; border-radius:8px; border:1px solid var(--rule);
    background:var(--card); color:var(--ink); font-family:'Inter',sans-serif;
    font-weight:600; font-size:13.5px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:6px; transition:transform .1s ease, background .15s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn.primary{ background:var(--violet); border-color:var(--violet); color:#fff; }
  .btn.ghost{ flex:0 0 52px; }
  .btn.known-btn.marked{ background:var(--green); border-color:var(--green); color:#fff; }

  .shuffle-row{ display:flex; gap:8px; }

  footer{
    margin-top:22px; text-align:center; font-size:10.5px; color:var(--ink-faint);
    letter-spacing:0.05em;
  }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-faint);
    font-family:'Source Serif 4',serif; font-style:italic; font-size:15px;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .switch, .switch::after, .progress-fill, .btn{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title">Katalog Kanji<small>JFT A2 · Tambahan Irodori</small></div>
    <div class="count-badge" id="countBadge">613 kartu</div>
  </header>

  <div class="section-row">
    <label class="section-label" for="sectionSelect">Bagian</label>
    <select id="sectionSelect" class="section-select"></select>
  </div>

  <div class="filters">
    <div class="chip active" data-filter="all">Semua</div>
    <div class="chip" data-filter="unknown">Belum hafal</div>
    <div class="chip" data-filter="known">Hafal</div>

  <div class="progress-row">

    <div class="progress-label" id="progressLabel">0 / 0</div>
  </div>

  <div class="stage">
    <div class="card" id="card">
      <div class="face face-front">
        <div class="face-top">
          <span class="catalog-no" id="catNo">№ —</span>
          <span class="status-dot" id="statusDot"></span>
        </div>
        <div class="face-body">
          <div class="kanji-glyph hide-furigana" id="kanjiGlyph"></div>
        </div>
        <div class="face-bottom">Ketuk kartu untuk lihat arti</div>
      </div>
      <div class="face back">
        <div class="reading" id="backReading"></div>
        <div class="rule"></div>
        <div class="meaning" id="backMeaning"></div>
        <div class="hint">Ketuk untuk kembali</div>
      </div>
    </div>
  </div>

  <div class="toggle-row">
    <span class="toggle-label">Tampilkan furigana</span>
    <div class="switch" id="furiganaSwitch"></div>
  </div>

  <div class="nav-row">
    <button class="btn ghost" id="prevBtn">◀</button>
    <button class="btn known-btn" id="knownBtn">✓ Tandai hafal</button>
    <button class="btn ghost" id="nextBtn">▶</button>
  </div>
  <div class="shuffle-row">
    <button class="btn primary" id="shuffleBtn">🔀 Acak kartu</button>
    <button class="btn" id="resetBtn">↺ Reset urutan</button>
  </div>

  <footer>Progres tersimpan otomatis di perangkat ini</footer>
</div>

const STORAGE_KEY = 'known_ids';
const SECTION_SIZE = 50;
let known = new Set();
let order = KANJI_DATA.map((_, i) => i);
let filter = 'all';
let section = 'all'; // 'all' or 'start-end' string
let pos = 0;
let flipped = false;
let showFurigana = false;

function buildSections(){
  const total = KANJI_DATA.length; // 613
  const sections = [{ key: 'all', label: 'Semua (№1–' + total + ')' }];
  for(let start = 1; start <= total; start += SECTION_SIZE){
    const end = Math.min(start + SECTION_SIZE - 1, total);
    sections.push({ key: start + '-' + end, label: '№ ' + start + '–' + end });
  }
  return sections;
}
const SECTIONS = buildSections();

const sectionSelect = document.getElementById('sectionSelect');
SECTIONS.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.key;
  opt.textContent = s.label;
  sectionSelect.appendChild(opt);
});
sectionSelect.addEventListener('change', () => {
  section = sectionSelect.value;
  pos = 0; flipped = false;
  render();
});

const card = document.getElementById('card');
const kanjiGlyph = document.getElementById('kanjiGlyph');
const backReading = document.getElementById('backReading');
const backMeaning = document.getElementById('backMeaning');
const catNo = document.getElementById('catNo');
const statusDot = document.getElementById('statusDot');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const countBadge = document.getElementById('countBadge');
const furiganaSwitch = document.getElementById('furiganaSwitch');
const knownBtn = document.getElementById('knownBtn');

async function loadKnown(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      known = new Set(JSON.parse(res.value));
    }
  }catch(e){ /* no saved data yet */ }
  render();
}

async function saveKnown(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(Array.from(known)), false);
  }catch(e){ console.error('gagal menyimpan progres', e); }
}

function currentDeck(){
  let list = order;
  if(section !== 'all'){
    const [start, end] = section.split('-').map(Number);
    list = list.filter(i => KANJI_DATA[i].no >= start && KANJI_DATA[i].no <= end);
  }
  if(filter === 'known') list = list.filter(i => known.has(KANJI_DATA[i].no));
  if(filter === 'unknown') list = list.filter(i => !known.has(KANJI_DATA[i].no));
  return list;
}

function render(){
  const deck = currentDeck();
  countBadge.textContent = deck.length + ' kartu';

  if(deck.length === 0){
    card.style.display = 'none';
    document.querySelector('.toggle-row').style.display='none';
    document.querySelector('.nav-row').style.display='none';
    document.querySelector('.shuffle-row').style.display='none';
    progressLabel.textContent = '0 / 0';
    progressFill.style.width = '0%';
    if(!document.getElementById('emptyMsg')){
      const div = document.createElement('div');
      div.id = 'emptyMsg';
      div.className = 'empty-state';
      div.textContent = filter === 'known' ? 'Belum ada kartu yang ditandai hafal di bagian ini.' : 'Semua kartu di bagian ini sudah hafal 🎉';
      card.parentElement.appendChild(div);
    }
    return;
  }else{
    const em = document.getElementById('emptyMsg');
    if(em) em.remove();
    card.style.display='';
    document.querySelector('.toggle-row').style.display='';
    document.querySelector('.nav-row').style.display='';
    document.querySelector('.shuffle-row').style.display='';
  }

  if(pos >= deck.length) pos = 0;
  if(pos < 0) pos = deck.length - 1;

  const item = KANJI_DATA[deck[pos]];
  catNo.textContent = '№ ' + String(item.no).padStart(3,'0');
  kanjiGlyph.innerHTML = '<ruby>' + item.kanji + '<rt>' + item.reading + '</rt></ruby>';
  kanjiGlyph.classList.toggle('hide-furigana', !showFurigana);
  backReading.textContent = item.reading;
  backMeaning.textContent = item.meaning;
  statusDot.classList.toggle('known', known.has(item.no));
  knownBtn.classList.toggle('marked', known.has(item.no));
  knownBtn.textContent = known.has(item.no) ? '✓ Sudah hafal' : '✓ Tandai hafal';

  progressLabel.textContent = (pos+1) + ' / ' + deck.length;
  progressFill.style.width = ((pos+1)/deck.length*100) + '%';

  card.classList.toggle('flipped', flipped);
}

card.addEventListener('click', () => {
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
});

document.getElementById('prevBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  flipped = false;
  pos -= 1;
  render();
});
document.getElementById('nextBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  flipped = false;
  pos += 1;
  render();
});

document.getElementById('knownBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const deck = currentDeck();
  const item = KANJI_DATA[deck[pos]];
  if(known.has(item.no)) known.delete(item.no);
  else known.add(item.no);
  saveKnown();
  render();
});

furiganaSwitch.addEventListener('click', (e) => {
  e.stopPropagation();
  showFurigana = !showFurigana;
  furiganaSwitch.classList.toggle('on', showFurigana);
  kanjiGlyph.classList.toggle('hide-furigana', !showFurigana);
});

document.getElementById('shuffleBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0; flipped = false;
  render();
});

document.getElementById('resetBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  order = KANJI_DATA.map((_, i) => i);
  pos = 0; flipped = false;
  render();
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    filter = chip.dataset.filter;
    pos = 0; flipped = false;
    render();
  });
});

document.addEventListener('keydown', (e) => {
  if(e.code === 'Space'){ e.preventDefault(); flipped = !flipped; card.classList.toggle('flipped', flipped); }
  if(e.code === 'ArrowRight'){ flipped=false; pos += 1; render(); }
  if(e.code === 'ArrowLeft'){ flipped=false; pos -= 1; render(); }
});

loadKnown();
</script>
</body>
</html>
