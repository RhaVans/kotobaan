name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Package Kotoba iOS (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Xcode Environment
        run: |
          echo "=== Available Xcode Versions ==="
          ls -d /Applications/Xcode* || true
          echo "=== Active Developer Directory ==="
          xcode-select -p
          echo "=== Xcodebuild Version ==="
          xcodebuild -version
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      - name: Build Xcode Archive
        run: |
          mkdir -p build
          xcodebuild archive \
            -project ios/Kotoba.xcodeproj \
            -scheme Kotoba \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kotoba.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/Kotoba.xcarchive/Products/Applications/Kotoba.app build/Payload/
          cd build
          zip -r9 "Kotoba.ipa" Payload
          shasum -a 256 "Kotoba.ipa" > "Kotoba.ipa.sha256"
          echo "=== Build Artifacts Generated ==="
          ls -lh Kotoba.ipa Kotoba.ipa.sha256
          cat Kotoba.ipa.sha256

      - name: Upload IPA & Checksum Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kotoba-iOS-IPA
          path: |
            build/Kotoba.ipa
            build/Kotoba.ipa.sha256
          retention-days: 30

      - name: Upload IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Kotoba.ipa
            build/Kotoba.ipa.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
